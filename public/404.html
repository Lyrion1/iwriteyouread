<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | iwriteyouread</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logoo.png">
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="font-sans text-gray-900 min-h-screen flex items-center justify-center">
    
    <div class="max-w-2xl mx-auto px-4 text-center bg-parchment-card">
        <!-- 404 Number -->
        <div class="mb-8">
            <h1 class="font-serif text-9xl font-bold" style="color: rgba(245,233,214,0.2)">404</h1>
        </div>
        
        <!-- Error Message -->
        <h2 class="font-serif text-4xl font-bold mb-4" style="color: var(--parchment, #f5e9d6)">
            Page Not Found
        </h2>
        
        <p class="text-lg mb-8 max-w-lg mx-auto" style="color: var(--c-text-dark, #e8dfd0)">
            The page you're looking for seems to have wandered off. Perhaps it's exploring democracy 
            and liberty elsewhere, or maybe it never existed at all.
        </p>
        
        <!-- Navigation Links -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <a href="/" class="px-8 py-4 font-semibold rounded-lg shadow-lg" style="background:var(--saffron,#c4752a);color:#fff;transition:background 250ms ease,transform 250ms ease,box-shadow 250ms ease;" onmouseover="this.style.background='#a3601e';this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 24px rgba(196,117,42,0.35)'" onmouseout="this.style.background='var(--saffron,#c4752a)';this.style.transform='';this.style.boxShadow=''">
                Go Home
            </a>
            <a href="/blog.html" class="px-8 py-4 font-semibold rounded-lg border-2 shadow-md" style="background:rgba(245,233,214,0.08);color:var(--parchment,#f5e9d6);border-color:var(--smoke,#6b6080);transition:background 250ms ease,border-color 250ms ease;" onmouseover="this.style.background='rgba(232,168,50,0.12)';this.style.borderColor='var(--gilt,#e8a832)'" onmouseout="this.style.background='rgba(245,233,214,0.08)';this.style.borderColor='var(--smoke,#6b6080)'">
                Read the Blog
            </a>
        </div>
        
        <!-- Decorative Element -->
        <div class="mt-12">
            <svg class="w-32 h-32 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:rgba(245,233,214,0.15)">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
    </div>
    
</body>
</html>
